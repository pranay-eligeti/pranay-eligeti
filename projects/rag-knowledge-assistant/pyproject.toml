[project]
name = "rag-knowledge-assistant"
version = "0.1.0"
description = "Testable RAG pipeline with chunking, embeddings, Qdrant retrieval and citations"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.60,<1",
  "qdrant-client[fastembed]>=1.14,<2",
  "pydantic>=2,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "anyio>=4,<5"
]
