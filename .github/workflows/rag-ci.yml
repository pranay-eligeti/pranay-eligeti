name: RAG CI

on:
  push:
    paths:
      - "README.md"
      - "projects/rag-knowledge-assistant/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "projects/rag-knowledge-assistant/**"
      - ".github/workflows/rag-ci.yml"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/projects/rag-knowledge-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        working-directory: projects/rag-knowledge-assistant
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: projects/rag-knowledge-assistant
        run: pytest -q
